<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TebakBox</title>
<link rel="stylesheet" href="style.css">
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
</head>
<body>
<div id="app">
  <header class="top"><div class="brand">TEBAK<span>BOX</span></div><div id="net" class="pill">● OFFLINE</div></header>

  <main id="home" class="page">
    <section class="hero">
      <div class="eyebrow">PRIVATE GAME LIBRARY</div>
      <h1>Siap bikin<br><span>tebak-tebakan?</span></h1>
      <p>Simpan game di HP, lalu mainkan kapan saja.</p>
      <button id="newGame" class="primary big">＋ Buat Game</button>
    </section>
    <section class="library">
      <div class="sectionHead"><h2>Library Game</h2><button id="importBtn" class="ghost">Import</button></div>
      <input id="importFile" type="file" accept=".tebakbox,application/json" hidden>
      <div id="games"></div>
    </section>
  </main>

  <main id="editor" class="page hidden">
    <div class="bar"><button id="backHome" class="ghost">← Kembali</button><button id="saveNow" class="ghost">✓ Tersimpan</button></div>
    <div class="editorHead"><div class="eyebrow">EDITOR GAME</div><h1 id="editorTitle">Buat Game</h1><p>Auto-save aktif. Isi semua level lalu simpan.</p></div>
    <label>Nama Game<input id="gameName" placeholder="Contoh: Tebak Makanan"></label>
    <div id="levels"></div>
    <div class="actions"><button id="saveGame" class="primary big">💾 Simpan Game</button></div>
  </main>

  <main id="host" class="page hidden"></main>
  <main id="player" class="page hidden"></main>
</div>
<div id="toast"></div>
<script src="app.js"></script>
</body>
</html>
